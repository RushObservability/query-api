name: Release

on:
  push:
    branches:
      - main
    paths:
      - Cargo.toml
  workflow_dispatch:

concurrency:
  group: query-api-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  security-gate:
    # Security checks are not run here: run `make security` (or `make release`) and decide before releasing.
    # fmt, Clippy, and tests already ran in `make release` and in Rust quality on the
    # release PR; the image build compiles from scratch, so nothing here is reused.
    name: Release checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, reviewed 2026-08-02
        with:
          toolchain: 1.89.0

      - name: Read and validate package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rush-api") | .version')"
          lock_version="$(
            awk '
              $0 == "name = \"rush-api\"" { in_package = 1; next }
              in_package && /^version = "/ {
                value = $0
                sub(/^version = "/, "", value)
                sub(/".*$/, "", value)
                print value
                exit
              }
            ' Cargo.lock
          )"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Cargo.toml has an invalid release version: $version" >&2
            exit 1
          fi
          if [[ "$lock_version" != "$version" ]]; then
            echo "Cargo.lock version $lock_version does not match Cargo.toml version $version" >&2
            echo "Run: cargo update -p rush-api --precise $version" >&2
            exit 1
          fi

          tag="v${version}"
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            # This run pushed the tag already; a re-run continues instead of failing.
            if [[ "$(git rev-parse "refs/tags/${tag}^{commit}")" != "$GITHUB_SHA" ]]; then
              echo "Tag ${tag} already exists on another commit. Bump the Cargo package version before releasing." >&2
              exit 1
            fi
            echo "Tag ${tag} already points at this commit; continuing." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${tag}" >> "$GITHUB_STEP_SUMMARY"

      - name: Test licensed release dispatch configuration
        run: python3 scripts/test-licensed-dispatch.py

      # Pushed now, seconds after the merge, while main still matches this commit.
      # GITHUB_TOKEN may not create a ref whose workflow files differ from main, and
      # a workflow change merged during the image build failed v0.1.8 and v0.1.9.
      - name: Push the release tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/${TAG}"
          fi

  build:
    # One native runner per architecture: arm64 under QEMU on an amd64 runner
    # took over two hours. Each leg pushes by digest; build-and-push tags the pair.
    name: Build ${{ matrix.arch }}
    needs: security-gate
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # github.repository keeps the owner's casing (RushObservability/query-api),
      # but an OCI reference must be lowercase.
      - name: Normalise the image name to lower case
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Docker metadata
        id: docker-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}
          provenance: mode=max
          sbom: true

      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  build-and-push:
    name: Publish multi-arch image
    needs: [security-gate, build]
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Lowercase for the hand-built references below: the index, the SBOM, and
      # both attestations. Keeps working if the repository is ever renamed.
      - name: Normalise the image name to lower case
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Docker metadata
        id: docker-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.security-gate.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.security-gate.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.security-gate.outputs.tag }}
            type=sha,prefix=

      - name: Create and push the multi-arch index
        id: push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ needs.security-gate.outputs.version }}
        run: |
          set -euo pipefail
          digests=(*)
          [ "${#digests[@]}" -eq 2 ] || { echo "expected 2 platform digests, got: ${digests[*]}" >&2; exit 1; }
          mapfile -t tag_args < <(jq -r '.tags[] | ("-t", .)' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create "${tag_args[@]}" "${digests[@]/#/${IMAGE}@sha256:}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)"
          docker buildx imagetools inspect "${IMAGE}@${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Attest image build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Generate image SBOM from pushed digest
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: rush-api-${{ needs.security-gate.outputs.tag }}.spdx.json
          artifact-name: rush-api-${{ needs.security-gate.outputs.tag }}-sbom
          upload-artifact: true
          upload-artifact-retention: 90
          upload-release-assets: false

      - name: Attest image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: rush-api-${{ needs.security-gate.outputs.tag }}.spdx.json
          push-to-registry: true

      - name: Record immutable release coordinates
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.push.outputs.digest }}
          SBOM_ARTIFACT: rush-api-${{ needs.security-gate.outputs.tag }}-sbom
        run: |
          {
            echo "### Immutable container release"
            echo
            echo "- Image: \`${IMAGE}@${DIGEST}\`"
            echo "- SBOM artifact: \`${SBOM_ARTIFACT}\` (SPDX JSON, retained 90 days)"
            echo "- Provenance and SBOM attestations: GitHub artifact attestations and OCI registry referrers"
            echo
            echo '```sh'
            echo "gh attestation verify 'oci://${IMAGE}@${DIGEST}' --repo '${GITHUB_REPOSITORY}'"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Find previous release
        id: previous-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Notes always start at the last non-RC release, so they span every candidate.
          previous_tag="$(
            gh release list \
              --limit 100 \
              --json tagName,isDraft,publishedAt \
              --jq 'map(select(.isDraft == false and (.tagName | contains("-") | not))) | sort_by(.publishedAt) | last | .tagName // ""'
          )"
          echo "tag=${previous_tag}" >> "$GITHUB_OUTPUT"
          if [[ -n "$previous_tag" ]]; then
            echo "Release notes will include pull requests merged after ${previous_tag}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No previous release found. Release notes will cover the full repository history." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.security-gate.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.previous-release.outputs.tag }}
          SBOM_PATH: rush-api-${{ needs.security-gate.outputs.tag }}.spdx.json
        run: |
          # The tag was pushed by Release checks; never create a ref this late.
          release_args=(
            "$RELEASE_TAG"
            "$SBOM_PATH"
            --verify-tag
            --title "$RELEASE_TAG"
            --generate-notes
          )
          if [[ -n "$PREVIOUS_TAG" ]]; then
            release_args+=(--notes-start-tag "$PREVIOUS_TAG")
          fi
          gh release create "${release_args[@]}"

  dispatch-licensed-build:
    name: Dispatch licensed build
    needs: [security-gate, build-and-push]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Create licensed-build App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.LICENSE_BUILDER_APP_CLIENT_ID }}
          private-key: ${{ secrets.LICENSE_BUILDER_APP_PRIVATE_KEY }}
          owner: RushObservability
          repositories: query-api-license
          permission-actions: write

      - name: Dispatch matching licensed release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_VERSION: ${{ needs.security-gate.outputs.version }}
          RELEASE_TAG: ${{ needs.security-gate.outputs.tag }}
          QUERY_API_SHA: ${{ github.sha }}
          PUBLIC_IMAGE_DIGEST: ${{ needs.build-and-push.outputs.image_digest }}
          SOURCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/RushObservability/query-api-license/actions/workflows/release.yml/dispatches" \
            -f ref=main \
            -f "inputs[version]=${RELEASE_VERSION}" \
            -f "inputs[query_api_ref]=${RELEASE_TAG}" \
            -f "inputs[query_api_sha]=${QUERY_API_SHA}" \
            -f "inputs[public_image_digest]=${PUBLIC_IMAGE_DIGEST}" \
            -f "inputs[source_run_url]=${SOURCE_RUN_URL}"
          echo "Dispatched query-api-license ${RELEASE_TAG}." >> "$GITHUB_STEP_SUMMARY"
