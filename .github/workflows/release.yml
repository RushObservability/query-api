name: Release

on:
  push:
    branches:
      - main
    paths:
      - Cargo.toml
  workflow_dispatch:

concurrency:
  group: query-api-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  security-gate:
    name: Security release gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, reviewed 2026-08-02
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Read and validate package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rush-api") | .version')"
          lock_version="$(
            awk '
              $0 == "name = \"rush-api\"" { in_package = 1; next }
              in_package && /^version = "/ {
                value = $0
                sub(/^version = "/, "", value)
                sub(/".*$/, "", value)
                print value
                exit
              }
            ' Cargo.lock
          )"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Cargo.toml has an invalid release version: $version" >&2
            exit 1
          fi
          if [[ "$lock_version" != "$version" ]]; then
            echo "Cargo.lock version $lock_version does not match Cargo.toml version $version" >&2
            echo "Run: cargo update -p rush-api --precise $version" >&2
            exit 1
          fi

          tag="v${version}"
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists. Bump the Cargo package version before releasing." >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${tag}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install cargo-audit
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-audit@0.22.2

      - name: Install cargo-deny
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-deny@0.20.2

      - name: Test advisory scan reporting
        run: python3 scripts/test-summarize-trivy.py

      - name: Test licensed release dispatch configuration
        run: python3 scripts/test-licensed-dispatch.py

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D clippy::correctness -D clippy::suspicious

      - name: Run tests
        run: cargo test --all-targets --all-features

      - name: Scan RustSec advisories
        run: cargo audit --ignore RUSTSEC-2023-0071

      - name: Enforce dependency policy
        run: cargo deny check --hide-inclusion-graph advisories bans licenses sources

      - name: Build release targets
        run: cargo build --release --all-features

  build-and-push:
    needs: security-gate
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # github.repository keeps the owner's casing (RushObservability/query-api),
      # but an OCI reference must be lowercase. docker/metadata-action lowercases
      # its own tags, which is why the push succeeds, so the mismatch only shows
      # up in the steps that build a reference by hand: the Trivy scan, the SBOM,
      # and both attestations. Overriding IMAGE_NAME here fixes all of them at
      # once and keeps working if the repository is ever renamed.
      - name: Normalise the image name to lower case
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Docker metadata
        id: docker-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.security-gate.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.security-gate.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.security-gate.outputs.tag }}
            type=sha,prefix=

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      # Image findings are advisory. Rust tests and dependency policy above
      # remain release gates; a Trivy outage must not prevent the SBOM either.
      - name: Report image vulnerabilities with Trivy
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: json
          output: trivy-report.json
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Summarize advisory image scan
        if: ${{ !cancelled() && steps.push.outcome == 'success' }}
        continue-on-error: true
        env:
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
        run: bash scripts/summarize-trivy.sh trivy-report.json

      - name: Upload Trivy report
        if: ${{ !cancelled() && steps.push.outcome == 'success' && hashFiles('trivy-report.json') != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rush-api-${{ needs.security-gate.outputs.tag }}-trivy
          path: trivy-report.json
          retention-days: 90
          if-no-files-found: warn

      - name: Attest image build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Generate image SBOM from pushed digest
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: rush-api-${{ needs.security-gate.outputs.tag }}.spdx.json
          artifact-name: rush-api-${{ needs.security-gate.outputs.tag }}-sbom
          upload-artifact: true
          upload-artifact-retention: 90
          upload-release-assets: false

      - name: Attest image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: rush-api-${{ needs.security-gate.outputs.tag }}.spdx.json
          push-to-registry: true

      - name: Record immutable release coordinates
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.push.outputs.digest }}
          SBOM_ARTIFACT: rush-api-${{ needs.security-gate.outputs.tag }}-sbom
        run: |
          {
            echo "### Immutable container release"
            echo
            echo "- Image: \`${IMAGE}@${DIGEST}\`"
            echo "- SBOM artifact: \`${SBOM_ARTIFACT}\` (SPDX JSON, retained 90 days)"
            echo "- Provenance and SBOM attestations: GitHub artifact attestations and OCI registry referrers"
            echo
            echo '```sh'
            echo "gh attestation verify 'oci://${IMAGE}@${DIGEST}' --repo '${GITHUB_REPOSITORY}'"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Find previous release
        id: previous-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          previous_tag="$(
            gh release list \
              --limit 100 \
              --json tagName,isDraft,publishedAt \
              --jq 'map(select(.isDraft == false)) | sort_by(.publishedAt) | last | .tagName // ""'
          )"
          echo "tag=${previous_tag}" >> "$GITHUB_OUTPUT"
          if [[ -n "$previous_tag" ]]; then
            echo "Release notes will include pull requests merged after ${previous_tag}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No previous release found. Release notes will cover the full repository history." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.security-gate.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.previous-release.outputs.tag }}
          SBOM_PATH: rush-api-${{ needs.security-gate.outputs.tag }}.spdx.json
        run: |
          release_args=(
            "$RELEASE_TAG"
            "$SBOM_PATH"
            --target "$GITHUB_SHA"
            --title "$RELEASE_TAG"
            --generate-notes
          )
          if [[ -n "$PREVIOUS_TAG" ]]; then
            release_args+=(--notes-start-tag "$PREVIOUS_TAG")
          fi
          gh release create "${release_args[@]}"

  dispatch-licensed-build:
    name: Dispatch licensed build
    needs: [security-gate, build-and-push]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Create licensed-build App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.LICENSE_BUILDER_APP_CLIENT_ID }}
          private-key: ${{ secrets.LICENSE_BUILDER_APP_PRIVATE_KEY }}
          owner: RushObservability
          repositories: query-api-license
          permission-actions: write

      - name: Dispatch matching licensed release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_VERSION: ${{ needs.security-gate.outputs.version }}
          RELEASE_TAG: ${{ needs.security-gate.outputs.tag }}
          QUERY_API_SHA: ${{ github.sha }}
          PUBLIC_IMAGE_DIGEST: ${{ needs.build-and-push.outputs.image_digest }}
          SOURCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/RushObservability/query-api-license/actions/workflows/release.yml/dispatches" \
            -f ref=main \
            -f "inputs[version]=${RELEASE_VERSION}" \
            -f "inputs[query_api_ref]=${RELEASE_TAG}" \
            -f "inputs[query_api_sha]=${QUERY_API_SHA}" \
            -f "inputs[public_image_digest]=${PUBLIC_IMAGE_DIGEST}" \
            -f "inputs[source_run_url]=${SOURCE_RUN_URL}"
          echo "Dispatched query-api-license ${RELEASE_TAG}." >> "$GITHUB_STEP_SUMMARY"
