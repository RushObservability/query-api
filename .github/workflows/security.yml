name: Rust quality

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.rs"
      - "**/*.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "rust-toolchain.toml"
      - "Dockerfile"
      - "Dockerfile.agent"
      - "docker-compose.yml"
      - ".github/workflows/**"
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    # Security checks (dependency scans, security policy scripts) run only before
    # a release: `make security`, called by `make release` and the Release workflow.
    name: Format, lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, reviewed 2026-08-02
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D clippy::correctness -D clippy::suspicious

      - name: Run tests
        run: cargo test --all-targets --all-features
        env:
          # PRs stay bounded; the weekly schedule exercises a much larger corpus.
          PROPTEST_CASES: ${{ github.event_name == 'schedule' && '4096' || '256' }}

      - name: Build release targets
        run: cargo build --release --all-features
