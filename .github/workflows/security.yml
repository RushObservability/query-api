name: Rust security and quality

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.rs"
      - "**/*.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "rust-toolchain.toml"
      - "Dockerfile"
      - "Dockerfile.agent"
      - "docker-compose.yml"
      - "scripts/check-container-policy.sh"
      - "scripts/check-public-errors.sh"
      - "scripts/check-llm-gateway.sh"
      - "scripts/check-security-regressions.sh"
      - "scripts/*security-report*"
      - "security/**"
      - ".github/workflows/**"
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  security-and-quality:
    name: Format, lint, test, build, and dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, reviewed 2026-08-02
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Install cargo-deny
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-deny@0.20.2

      # The policy scripts intentionally use ripgrep's multiline/PCRE-compatible
      # matching. ubuntu-latest does not guarantee that `rg` is preinstalled, so
      # install an explicit version instead of letting a missing binary turn into
      # a misleading policy failure.
      - name: Install policy search tool
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: ripgrep@14.1.1

      - name: Check formatting
        run: cargo fmt --check

      - name: Test security reporting
        run: node --test scripts/test-security-report.cjs

      - name: Enforce container deployment policy
        run: bash scripts/check-container-policy.sh

      - name: Prevent raw internal API errors
        run: bash scripts/check-public-errors.sh

      - name: Enforce bounded LLM gateway usage
        run: bash scripts/check-llm-gateway.sh

      - name: Enforce adversarial parser and authorization coverage
        run: bash scripts/check-security-regressions.sh

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D clippy::correctness -D clippy::suspicious

      - name: Run tests
        run: cargo test --all-targets --all-features
        env:
          # PRs stay bounded; the weekly schedule exercises a much larger corpus.
          PROPTEST_CASES: ${{ github.event_name == 'schedule' && '4096' || '256' }}

      - name: Build release targets
        run: cargo build --release --all-features

      - name: Enforce dependency policy
        run: cargo deny check --hide-inclusion-graph bans licenses sources

  dependency-report:
    name: Dependency security report (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, reviewed 2026-08-02
        with:
          toolchain: 1.88.0

      - name: Install scanners
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2

      - name: Scan dependencies without blocking the PR
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p security-report
          set +e
          cargo audit --json --ignore RUSTSEC-2023-0071 > security-report/audit.json 2> security-report/audit.log
          echo "$?" > security-report/audit-exit.txt
          cargo deny --format json check --hide-inclusion-graph advisories > security-report/deny.stdout 2> security-report/deny.jsonl
          echo "$?" > security-report/deny-exit.txt
          exit 0

      - name: Summarize findings
        if: ${{ !cancelled() }}
        run: node scripts/security-report.cjs security-report

      - name: Save scan reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-security-report
          path: security-report/
          retention-days: 30
          if-no-files-found: warn
