# Local-development stack only. Published ports stay on loopback and the
# credentials below are deliberately nonempty local defaults.
services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.6.1.1193
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-rushdev}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-rush-local-clickhouse-password}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/config.d/local-storage.xml:/etc/clickhouse-server/config.d/local-storage.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 10

  query-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_DATABASE=observability
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-rushdev}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-rush-local-clickhouse-password}
      # Local single-tenant compatibility only. Production must configure the
      # distinct CLICKHOUSE_READ_* principal and verified row policies.
      - RUSH_ALLOW_INSECURE_TENANT_READS=true
      - RUST_LOG=rush_api=info,tower_http=info
      # jemalloc tuning: run a background thread that returns freed pages to the
      # OS within a few seconds (dirty/muzzy decay), keeping steady-state RSS low.
      - MALLOC_CONF=background_thread:true,dirty_decay_ms:5000,muzzy_decay_ms:5000
      # Optional ClickHouse read-path memory guardrails (defaults applied if unset):
      # - RUSH_CH_MAX_MEMORY_USAGE=4000000000   # per-query byte ceiling (4 GiB)
      # - RUSH_CH_MAX_BYTES_EXTERNAL=2000000000  # spill-to-disk threshold (default: half of above)
      # - RUSH_CH_MAX_THREADS=                   # cap per-query CPU fan-out (default: CH default)
    depends_on:
      clickhouse:
        condition: service_healthy
    profiles:
      - full

  sre-agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    ports:
      - "127.0.0.1:8081:8081"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_DATABASE=observability
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-rushdev}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-rush-local-clickhouse-password}
      - SRE_AGENT_PORT=8081
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - RUST_LOG=rush_api=info,tower_http=info
    depends_on:
      clickhouse:
        condition: service_healthy
    profiles:
      - full

volumes:
  clickhouse-data:
