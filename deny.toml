[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
all-features = true

[advisories]
# Transitive unmaintained crates are tracked in docs/dependency-security.md.
# A direct unmaintained dependency is a release-blocking error.
unmaintained = "workspace"
unsound = "all"
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "RSA is used only for public-key signature verification; no private RSA operation is reachable. Temporary exception expires 2026-11-01; see docs/dependency-security.md." },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 comes through elliptic-curve 0.13 (SAML via opensaml/bergshamra, OIDC JWTs via jsonwebtoken). Production only verifies signatures with public keys; signing appears only in tests, so no secret value reaches the non-constant-time code. No saml-rs release uses crypto-bigint 0.7 yet; remove when one does." },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
# Older versions held by dependencies that are already on their latest release.
skip = [
    { crate = "hashbrown@0.14.5", reason = "dashmap 6.2 (latest) still uses it" },
    { crate = "itertools@0.14.0", reason = "prost-derive 0.14 (latest) still uses it" },
    { crate = "rand@0.9.5", reason = "opentelemetry_sdk 0.33 (latest) and proptest still use it" },
    { crate = "rand@0.8.7", reason = "bergshamra 0.7 (SAML test signing, dev-dependency) uses it" },
    { crate = "vob@3.0.6", reason = "sparsevec 0.2 via promql-parser 0.7 uses it" },
]
skip-tree = [
    # Both pin the RustCrypto 0.10 generation (digest, cipher, rand 0.8, der, spki,
    # crypto-bigint 0.5, ...) while query-api uses the current one. No opensaml or
    # jsonwebtoken release we can adopt moves off it yet.
    { crate = "opensaml@0.3.0", reason = "pins the RustCrypto 0.10 generation" },
    { crate = "jsonwebtoken@10.4.0", reason = "pins the RustCrypto 0.10 generation" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
exceptions = [
    { allow = ["BUSL-1.1"], crate = "rush-api" },
]

[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
