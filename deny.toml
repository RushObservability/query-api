[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
all-features = true

[advisories]
# Transitive unmaintained crates are tracked in docs/dependency-security.md.
# A direct unmaintained dependency is a release-blocking error.
unmaintained = "workspace"
unsound = "all"
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "RSA is used only for public-key signature verification; no private RSA operation is reachable. Temporary exception expires 2026-11-01; see docs/dependency-security.md." },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[licenses]
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
exceptions = [
    { allow = ["BUSL-1.1"], crate = "rush-api" },
]

[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
